{% extends "base.html" %}
{% block title %}Remover Fonte de Log - SOC Control{% endblock %}
{% block content %}
<h2>Remover Fonte de Log</h2>
<div class="card shadow-sm" style="max-width: 480px;">
    <div class="card-body">
        <p>Confirma a remoção de <strong>{{ object.log_source }}</strong> do cliente <strong>{{ object.client }}</strong>?</p>
        <form method="post">
            {% csrf_token %}
            <button type="submit" class="btn btn-danger">Remover</button>
            <a href="{% url 'clients:client_detail' pk=object.client_id %}" class="btn btn-outline-secondary">Cancelar</a>
        </form>
    </div>
</div>
{% endblock %}
