{% extends "base.html" %}
{% block title %}Excluir controle - SOC Control{% endblock %}
{% block content %}
<h2>Excluir controle</h2>
<div class="card shadow-sm" style="max-width: 480px;">
    <div class="card-body">
        <p>Confirma a exclusão de <strong>{{ object }}</strong>?</p>
        <form method="post">
            {% csrf_token %}
            <button type="submit" class="btn btn-danger">Excluir</button>
            <a href="{% url 'taxonomy:framework_detail' pk=object.framework_id %}" class="btn btn-outline-secondary">Cancelar</a>
        </form>
    </div>
</div>
{% endblock %}
