# Replace SEU_DOMINIO_AQUI below with the real domain before first deploy
# (see docker-compose.prod.yml's usage comment for the full bootstrap steps).

upstream django {
    server web:8000;
}

server_tokens off;

# Plain HTTP: only serves the ACME challenge (certbot) and redirects
# everything else to HTTPS.
server {
    listen 80;
    server_name SEU_DOMINIO_AQUI;

    location /.well-known/acme-challenge/ {
        root /var/www/certbot;
    }

    # Docker healthcheck (docker-compose.prod.yml) hits this over plain HTTP -
    # keep it out of the HTTPS redirect below so the check doesn't have to
    # follow a redirect to a domain the container can't resolve on its own.
    location /healthz/ {
        proxy_pass http://django;
        proxy_set_header Host $http_host;
    }

    location / {
        return 301 https://$host$request_uri;
    }
}

server {
    listen 443 ssl;
    http2 on;
    server_name SEU_DOMINIO_AQUI;
    client_max_body_size 20M;

    ssl_certificate /etc/letsencrypt/live/SEU_DOMINIO_AQUI/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/SEU_DOMINIO_AQUI/privkey.pem;
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_ciphers HIGH:!aNULL:!MD5;
    ssl_prefer_server_ciphers off;

    location /static/ {
        alias /app/staticfiles/;
    }

    location /media/ {
        alias /app/mediafiles/;
    }

    location / {
        proxy_pass http://django;
        proxy_set_header Host $http_host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }
}
