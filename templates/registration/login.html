{% extends "base.html" %}
{% block title %}Entrar - SOC Control{% endblock %}
{% block content %}
<div class="login-shell">
    <div class="login-card">
        <div class="login-icon"><i class="bi bi-shield-lock-fill"></i></div>
        <h4 class="text-center mb-1">SOC Control</h4>
        <p class="text-muted text-center small mb-4">Entre com sua conta para continuar</p>

        {% if form.errors %}
            <div class="alert alert-danger py-2 small">Usuário ou senha inválidos.</div>
        {% endif %}

        <form method="post">
            {% csrf_token %}
            <div class="mb-3">
                <label class="form-label small fw-semibold">Usuário</label>
                {{ form.username }}
            </div>
            <div class="mb-3">
                <label class="form-label small fw-semibold">Senha</label>
                {{ form.password }}
            </div>
            <input type="hidden" name="next" value="{{ next }}">
            <button type="submit" class="btn btn-primary w-100">Entrar</button>
        </form>
    </div>
</div>
{% endblock %}
